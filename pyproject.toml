[project]
name = "astrea-fake-mail-generator"
version = "0.1.0"
description = "Generate fake .eml email files for tests."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "faker==37.12.0",
    "jsonschema==4.25.1",
]

[project.scripts]
astrea = "astrea.cli:main"

[project.urls]
Repository = "https://github.com/flarebyte/astrea-fake-mail-generator"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrea"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.coverage.run]
source = ["astrea", "scripts"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "coverage>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
